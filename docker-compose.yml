services:
  postgres:
    image: postgres:16
    container_name: code-reviewer-db
    environment:
      POSTGRES_DB: code_reviewer
      POSTGRES_USER: codereviewer
      POSTGRES_PASSWORD: codereviewer123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: